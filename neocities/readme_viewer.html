<!DOCTYPE html>
<!-- JUSTE POUR VOIR LE MARKDOWN EN TANT QUE SITE -->
<html>
    <head>
        <meta charset="utf-8">
        <title>README</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>
    <body>
        <main>
            <div id="content"></div>
        </main>

        <script>
            fetch("README.md")
                .then(r => r.text())
                .then(md => {
                    document.getElementById("content").innerHTML = marked.parse(md);
                });
        </script>
    </body>
</html>
