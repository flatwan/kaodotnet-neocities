<!DOCTYPE html>

<html class="desktop_bg3">
    <head>
        <title>Projects</title>
        <link rel="icon" type="image/x-icon" href="./resources/projects_icon.png?v=1">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link href="./style.css?v=3" rel="stylesheet" type="text/css" media="all">
        <link href="./window.css?v=1" rel="stylesheet" type="text/css" media="all">
        <link href="./components/bars.css?v=1" rel="stylesheet" type="text/css" media="all">
    </head>

    <body>
        <main>
            <div class="frame window">
                <div class="window-titlebar">
                    <div class="window-titlebar-left">
                        <img src="./resources/explorer_icon.png?v=2" height="25">
                        <h2 class="window-titlebar-title">Projects</h2>
                    </div>

                    <div class="window-titlebar-buttons">
                        <h2><a class="plain_link" href="./index.html"><img src="./resources/ttbar_icon-close.png?v=1" alt="red cross (close window)" width="26px" height="24px"></a></h2>
                    </div>
                </div>

                <hr class="window-seperation">
                <div class="window-content">
                    <div class="explorer">
                        <!--artworks icon -->
                        <div class="explorer_icon" title="(double click)"
                        ondblclick="window.location='./artworks.html'">
                            <img src="./resources/artworks_icon-sc.png?v=1" class="explorer_icon-icon">
                            <p class="explorer_icon-text">Artworks</p>
                        </div>
                        <!--videos icon -->
                        <div class="explorer_icon" title="(double click)"
                        ondblclick="window.location='./videos.html'">
                            <img src="./resources/videos_icon-sc.png?v=1" class="explorer_icon-icon">
                            <p class="explorer_icon-text">Videos</p>
                        </div>
                        <!--games icon -->
                        <div class="explorer_icon" title="(double click)"
                        ondblclick="window.location='./games.html'">
                            <img src="./resources/games_icon-sc.png?v=1" class="explorer_icon-icon">
                            <p class="explorer_icon-text">Games</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="place-taskbar"></div>
    </body>
    
    <script src="./js/include.js?v=1"></script>
    <script src="./js/select.js?v=1"></script>
    <script src="./js/load.js?v=1"></script>
</html>
